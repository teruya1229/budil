name: Budil calendar isolated candidate import (dev only)
on:
  push:
    branches:
      - feat/budil-calendar-write-sandbox-20261111
    paths:
      - .github/workflows/budil-gcal-import.yml

permissions:
  contents: write

concurrency:
  group: budil-gcal-import-20261111
  cancel-in-progress: false

jobs:
  import-isolated-candidate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Assert runner, import code, execute isolated tests and commit only to dev branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'bc-bantou-dev') { throw 'RUNNER_NAME_MISMATCH' }
          if ($env:GITHUB_REF_NAME -ne 'feat/budil-calendar-write-sandbox-20261111') { throw 'BRANCH_MISMATCH' }
          $source = 'C:\dev\browser-bantou\output\budil-gcal-prod-candidate-20261111'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw 'SOURCE_MISSING' }
          $files = @(
            'atomic-ledger.cjs',
            'booking-command.cjs',
            'booking-preview.cjs',
            'existing-read-booking.js',
            'fakes.cjs',
            'google-calendar-http.cjs',
            'production-call-adapter.cjs',
            'calendar-route.cjs',
            'schema-proposal.sql',
            'transaction.cjs',
            'verify.cjs',
            'verify-extra.cjs',
            'REPORT.md',
            'ROUND2-REPORT.md',
            'BASELINE-BLOCKED-20261111.md'
          )
          $destination = Join-Path $env:GITHUB_WORKSPACE 'experiments\budil-gcal-write-sandbox'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          foreach ($name in $files) {
            $from = Join-Path $source $name
            if (-not (Test-Path -LiteralPath $from -PathType Leaf)) { throw "REQUIRED_SOURCE_MISSING: $name" }
            $size = (Get-Item -LiteralPath $from).Length
            if ($size -gt 400000) { throw "OVERSIZED_SOURCE: $name" }
            $content = [System.IO.File]::ReadAllText($from)
            if ($content.Contains('-----BEGIN PRIVATE KEY-----') -or $content.Contains('-----BEGIN RSA PRIVATE KEY-----')) {
              throw "CREDENTIAL_LIKE_CONTENT: $name"
            }
            Copy-Item -LiteralPath $from -Destination (Join-Path $destination $name)
          }
          Push-Location $destination
          try {
            node verify.cjs
            if ($LASTEXITCODE -ne 0) { throw 'VERIFY_CJS_FAILED' }
            node verify-extra.cjs
            if ($LASTEXITCODE -ne 0) { throw 'VERIFY_EXTRA_FAILED' }
          } finally { Pop-Location }
          git add -- experiments/budil-gcal-write-sandbox
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'STAGED_DIFF_INVALID' }
          $changed = git diff --cached --name-only
          foreach ($name in $changed) {
            if (-not $name.StartsWith('experiments/budil-gcal-write-sandbox/')) {
              throw 'UNEXPECTED_STAGED_PATH'
            }
          }
          if (-not $changed) { Write-Output 'NO_NEW_CODE_CHANGES'; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: import offline Budil calendar booking contract into isolated sandbox'
          if ($LASTEXITCODE -ne 0) { throw 'COMMIT_FAILED' }
          git push origin HEAD:refs/heads/feat/budil-calendar-write-sandbox-20261111
          if ($LASTEXITCODE -ne 0) { throw 'DEV_BRANCH_PUSH_FAILED' }
          Write-Output ('BUDIL_GCAL_SANDBOX_COMMIT=' + (git rev-parse HEAD))
