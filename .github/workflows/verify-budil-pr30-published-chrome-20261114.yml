name: Budil PR30 published URL disposable Chrome verification
on:
  push:
    branches: [verify/budil-pr30-live-hosted-chrome-20261114]
    paths: ['.github/workflows/verify-budil-pr30-published-chrome-20261114.yml']
permissions:
  contents: read
jobs:
  public-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PR30 live production index and assets
        run: node scripts/verify-budil-live-published.mjs
      - name: Run all GPT scenarios against real public Pages in disposable Chrome
        env:
          BUDIL_GPT_LIVE_VERIFY_URL: https://teruya1229.github.io/budil/
        run: node scripts/verify-budil-gpt-chat-browser.mjs
      - name: Verify safe Google fallback contracts
        run: node scripts/verify-budil-gpt-chat.mjs
