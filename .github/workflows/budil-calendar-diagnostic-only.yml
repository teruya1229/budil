name: Isolated diagnostic-only release smoke
on:
  push:
    branches:
      - qa/budil-calendar-diagnostic-only-20261112
permissions:
  contents: read
jobs:
  chrome:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe JWT handling and Chrome user journey
        run: |
          node --check js/budil-cloud.js
          node --check js/budil-gpt-offline-ui.js
          node scripts/verify-budil-cloud-diagnostic-client.mjs
          node scripts/verify-budil-diagnostic-release-browser.mjs
